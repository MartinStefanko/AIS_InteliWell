# Application Structure pre FR1 (draft).
# Zdroj: docx kap. 9.1.2, 9.2.2, 11.2; views Application Cooperation / Usage / Layered TO-BE.
# Vlastníctvo dát podľa DR-12 (ADR-006, Accepted). Allowed dependencies nie sú rozhodnuté.

meta:
  status: "approved"
  approved_by: "Martin Štefanko (Software architect)"
  reviewed_by: "Martin Štefanko (Software architect)"
  architecture_baseline: "B-01"
  specification_version: "0.2.0"

application_components:
  - id: "AC-IntelliWell"
    name: "IntelliWell"
    responsibility: >
      Interný systém, ktorého súčasťou sú štyri moduly. Číta aj zapisuje spoločné
      údaje: rezervácie, evidenciu klientov a evidenciu zásahov. (docx kap. 9.2.2, 11.2)
    composed_of:
      - "AC-ModulRezervaciiAKlientov"
      - "AC-ModulRiadeniaAMonitorovaniaZariadeni"
      - "AC-ModulKoordinacieSaunovychMajstrov"
      - "Modul prehľadov zásahov" # mimo FR1, ID nenavrhnuté
    accesses_data_objects: ["DO-Rezervacie", "DO-EvidenciaKlientov"] # aj Evidencia zásahov (mimo FR1)
    access_note: "Vlastníkom DO-Rezervacie a DO-EvidenciaKlientov je modul AC-ModulRezervaciiAKlientov (DR-12, ADR-006)."
    requirements: ["NFR4"]
    decisions: ["ADR-004"]

  - id: "AC-ModulRezervaciiAKlientov"
    name: "Modul rezervácií a klientov"
    responsibility: >
      Eviduje rezervácie a profily klientov a odovzdáva parametre rezervácie modulu
      riadenia a monitorovania zariadení. Ak si klient želá saunového majstra, pošle
      požiadavku modulu koordinácie saunových majstrov. (docx kap. 9.1.2)
      Overuje dostupnosť termínu, blokuje obsadené termíny a kontroluje existenciu
      klienta. (docx kap. 14)
    responsibility_in_fr1: >
      Vytvára rezerváciu pre existujúceho klienta, overuje dostupnosť termínu (BR-001, BR-003 až BR-008),
      rieši súbeh (BR-009, ADR-001), blokuje termín (BR-002) a zaznamenáva autora a čas vytvorenia (QR-001).
    part_of: "AC-IntelliWell"
    provides_services:
      - "AS-SpravaRezervaciiAKlientov"
    uses_services: null # nerozhodnuté
    owns_data_objects: ["DO-Rezervacie", "DO-EvidenciaKlientov"] # DR-12, ADR-006 (Accepted)
    allowed_dependencies: null # nerozhodnuté – rozhodne človek
    observed_interactions: ["INT-001", "INT-002", "INT-003"] # Application Cooperation View TO-BE; pre FR1 pozri interactions.yaml
    requirements: ["FR1", "NFR1", "QR-001"] # podľa služby aj FR2 (mimo rozsahu FR1)
    decisions: ["ADR-001", "ADR-006"]

  - id: "AC-ModulRiadeniaAMonitorovaniaZariadeni"
    name: "Modul riadenia a monitorovania zariadení"
    responsibility: "Kontext pre FR1: prijíma parametre rezervácie od modulu rezervácií a klientov (docx kap. 9.1.2)."
    part_of: "AC-IntelliWell"
    in_scope_of_fr1: false

  - id: "AC-ModulKoordinacieSaunovychMajstrov"
    name: "Modul koordinácie saunových majstrov"
    responsibility: >
      Kontext pre FR1: prijíma požiadavku od modulu rezervácií a klientov a po potvrdení
      zaeviduje priradenie späť k rezervácii (docx kap. 9.1.2).
    part_of: "AC-IntelliWell"
    in_scope_of_fr1: false # DR-10: priradenie saunového majstra je mimo FR1
