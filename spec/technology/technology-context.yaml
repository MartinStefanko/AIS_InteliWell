# Technology context pre FR1 (draft).
# Zdroj: docx kap. 10.1.2, 10.2.2, 11.2, 13.2, Layered View TO-BE a ľudské rozhodnutia DR-05 (zmena na .NET 10), DR-06, DR-09
# (log 0002, ADR-002, ADR-003 – oba Accepted).

technology_context:
  status: "applicable" # DR-09
  reason: >
    FR1 sa v prototype implementuje na rozhodnutej platforme (.NET 10 LTS, ASP.NET Core – ADR-002) s databázou
    SQLite (ADR-003). Tieto voľby ovplyvňujú code, configuration aj deployable Artifact.
  confirmed_by_role: "Software architect" # DR-09, Martin Štefanko
  approved_by: "Martin Štefanko (Software architect)"
  reviewed_by: "Martin Štefanko (Software architect)"
  architecture_baseline: "B-01"
  specification_version: "0.2.0"
  draft_status: "approved"

nodes:
  - id: "NODE-ServerIntelliWell"
    name: "Server IntelliWell"
    description_in_source: >
      Jadro budúceho stavu. Je na ňom nasadený softvér IntelliWell (artifact) spolu
      s databázovým systémom (docx kap. 10.1.2). Realizuje službu hostovania systému
      IntelliWell (kap. 10.2.2, 11.2).
    continuum_note: "Enterprise Continuum uvádza 'Serverová infraštruktúra (virtuálny server pre IntelliWell)' (docx kap. 13.2) – neschválené."
    prototype_environment: null # kde beží prototyp (lokálny počítač / server), nebolo rozhodnuté

system_software:
  - id: "SSW-DatabazovySystem"
    name: "Databázový systém"
    host_node: "NODE-ServerIntelliWell"
    provides_services: ["TS-DatabazovaSluzba"]
    description_in_source: >
      Uchováva rezervácie, evidenciu klientov a evidenciu zásahov (docx kap. 10.1.2).
    product:
      prototype: "SQLite" # DR-06, ADR-003 (Accepted)
      production: null # DR-06: zostáva otvorené
    version: null # nebolo rozhodnuté
    note: >
      SQLite beží v procese aplikácie, nie ako samostatný server. Layered View zobrazuje samostatný
      System Software. Pre prototyp ide o zjednodušenie (ADR-003).
    continuum_note: "Enterprise Continuum uvádza 'Centrálna relačná databáza' / 'Relačná databáza' (docx kap. 13)."

  - id: "SSW-RuntimeDotNet"
    name: "Runtime .NET 10 (ASP.NET Core)"
    host_node: "NODE-ServerIntelliWell"
    provides_services: ["TS-HostovanieSystemu"] # návrh AI – potvrdí človek
    description: "Runtime pre ART-SoftverIntelliWell podľa DR-05 / ADR-002."
    in_architecture_views: false # nový prvok; v B-01 views nie je zobrazený – navrhnuté ID
    version: "10 (LTS)" # DR-05
    status: "approved"

technology_services:
  - id: "TS-HostovanieSystemu"
    name: "Hostovanie systému IntelliWell"
    realized_by: "NODE-ServerIntelliWell"
    used_by: ["AC-IntelliWell"]
    source_view: "spec/architecture/views/B-01-layered-tobe.png"
  - id: "TS-DatabazovaSluzba"
    name: "Databázová služba"
    realized_by: "SSW-DatabazovySystem"
    used_by: ["AC-IntelliWell"] # "využíva pri každej práci s údajmi" (docx kap. 10.2.2)
    source_view: "spec/architecture/views/B-01-layered-tobe.png"

communication_networks:
  - id: "NET-KomunikacnaSiet"
    name: "Komunikačná sieť"
    description_in_source: >
      Prepája server IntelliWell so zariadeniami personálu (zariadenie recepcie,
      saunového majstra a manažéra) a s inteligentnými zariadeniami v miestnosti
      NikaWell (docx kap. 10.1.2). Poskytuje službu diaľkového prístupu k zariadeniam
      (kap. 10.2.2) – tá sa FR1 netýka.
    continuum_note: "Enterprise Continuum uvádza 'Sieťová infraštruktúra (LAN / Wi-Fi)' (docx kap. 13.2) – neschválené."

artifacts:
  details: "spec/technology/deployment.yaml"

implementation_platform:
  value: ".NET 10 LTS (C#), ASP.NET Core" # DR-05 (zmena z .NET 8)
  decision: "ADR-002" # Accepted
  source_note: >
    Docx uvádza ".NET (C#) ako predpokladaná implementačná platforma" (kap. 13.2, 15.2).

open_questions:
  - "Produkčný DBMS (DR-06 – otvorené)."
  - "Prostredie, v ktorom beží prototyp (lokálne / server IntelliWell), a či sa použije container – nerozhodnuté."
  - "Potvrdiť nový prvok SSW-RuntimeDotNet a jeho väzbu na TS-HostovanieSystemu."
  - "Časové pásmo prevádzky: Europe/Bratislava (DR-18) – systém potrebuje údaje o časových pásmach na prepočet UTC."
