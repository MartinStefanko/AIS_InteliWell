                    clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    startTime: "2026-12-01T14:00:00Z"
                    endTime: "2026-12-01T15:00:00Z"
                    status: created
                    createdBy: jana
                    createdAt: "2026-11-25T11:00:00Z"
        "400":
          description: |
            Neplatná požiadavka (BR-012 pozícia 3; NFR1): telo nie je JSON, chýba `clientId` alebo `startTime`,
            `clientId` nie je UUID, `startTime` nie je čas RFC 3339 alebo nemá príponu `Z` (napr. `+01:00`; DR-C03).
            Rezervácia nevznikne. Typ `invalid-request`. Dĺžka poznámky sa tu nekontroluje – jej prekročenie je
            business pravidlo BR-008 (422 `note-too-long`).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                invalid-request-time-offset:
                  summary: Čas s posunom +01:00 namiesto prípony Z (DR-C03) – bez scenára v US-001
                  value:
                    type: urn:intelliwell:problem:invalid-request
                    title: neplatná požiadavka
                    status: 400
                    detail: Pole startTime musí byť čas RFC 3339 v UTC s príponou Z.
                    instance: /api/v1/reservations
        "401":
          description: |
            Osoba nie je prihlásená: chýba bearer token alebo je neplatný (BR-011, NFR4, ADR-004; BR-012 pozícia 1).
            Platný bearer token, ktorý nemá neprázdny claim `sub`, sa posudzuje ako požiadavka neprihlásenej osoby
            a vráti 401 bez ohľadu na claim `role` (ADR-007 doplnenie, DR-C12).
            Rezervácia nevznikne a termín zostane voľný. Scenár SC-001-13. Typ `unauthenticated`.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            WWW-Authenticate:
              description: Výzva na autentifikáciu, schéma `Bearer` (RFC 6750).
              schema:
                type: string
                examples: [Bearer]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                SC-001-13:
                  summary: Požiadavka bez bearer tokenu
                  value:
                    type: urn:intelliwell:problem:unauthenticated
                    title: osoba nie je prihlásená
                    status: 401
                    instance: /api/v1/reservations
                unauthenticated-missing-sub:
                  summary: Token bez neprázdneho claimu sub (DR-C12) – bez scenára v US-001
                  value:
                    type: urn:intelliwell:problem:unauthenticated
                    title: osoba nie je prihlásená
                    status: 401
                    instance: /api/v1/reservations
        "403":
          description: |
            Prihlásená osoba nemá v claime `role` hodnotu `SpravcaNavstev`, ktorá zodpovedá ROLE-SpravcaNavstev;
            iná hodnota alebo chýbajúci claim `role` znamená nedostatočné oprávnenie (BR-011, ADR-004, ADR-007;
            BR-012 pozícia 2). Rezervácia nevznikne a termín zostane voľný. Scenár SC-001-12. Typ `forbidden`.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                SC-001-12:
                  summary: Token saunového majstra bez roly SpravcaNavstev
                  value:
                    type: urn:intelliwell:problem:forbidden
                    title: nedostatočné oprávnenie
                    status: 403
                    instance: /api/v1/reservations
        "409":
          description: |
            Termín obsadený: termín sa prekrýva s uloženou rezerváciou (BR-003), vrátane súbehu (BR-009,
            ADR-001) a opakovaného odoslania (DR-28); BR-012 pozícia 9. Rezervácia nevznikne, pôvodná rezervácia
            sa nemení, iný termín sa neponúka (BR-010). Scenáre SC-001-04, SC-001-05, druhá požiadavka v SC-001-06.
            Typ `slot-occupied`.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                SC-001-04:
                  summary: Termín 1. 12. 2026 14:00–15:00 je už rezervovaný
                  value:
                    type: urn:intelliwell:problem:slot-occupied
                    title: termín obsadený
                    status: 409
                    instance: /api/v1/reservations
                SC-001-05:
                  summary: Termín 14:30–15:30 sa čiastočne prekrýva s rezerváciou 14:00–15:00
                  value:
                    type: urn:intelliwell:problem:slot-occupied
                    title: termín obsadený
                    status: 409
                    instance: /api/v1/reservations
                SC-001-06:
                  summary: Druhá z dvoch súbežných požiadaviek na termín 4. 12. 2026 16:00
                  value:
                    type: urn:intelliwell:problem:slot-occupied
                    title: termín obsadený
                    status: 409
                    instance: /api/v1/reservations
        "422":
          description: |
            Vstup má platný tvar, ale nespĺňa business pravidlo (NFR1, BR-010). Rezervácia nevznikne.
            Typ určuje pomenovaný dôvod; pri viacerých porušeniach sa vráti prvý podľa BR-012 (pozície 5–8):
            - `client-not-found` – „klient neexistuje v evidencii klientov“ (BR-007; SC-001-07, SC-001-16),
            - `start-not-in-future` – „začiatok termínu nie je v budúcnosti“ (BR-006; SC-001-10),
            - `outside-opening-hours` – „termín mimo otváracích hodín“ (BR-005; SC-001-08, SC-001-09),
            - `note-too-long` – „poznámka je dlhšia ako 500 znakov“ (BR-008; SC-001-11).
            Odpoveď nikdy neobsahuje text poznámky (CON-003).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                SC-001-07:
                  summary: Klient s týmto identifikátorom nie je v evidencii klientov
                  value:
                    type: urn:intelliwell:problem:client-not-found
                    title: klient neexistuje v evidencii klientov
                    status: 422
                    instance: /api/v1/reservations
                SC-001-08:
                  summary: Termín 21:30–22:30 presahuje zatváraciu hodinu 22:00
                  value:
                    type: urn:intelliwell:problem:outside-opening-hours
                    title: termín mimo otváracích hodín
                    status: 422
                    instance: /api/v1/reservations
                SC-001-09:
                  summary: Termín 09:30–10:30 začína pred otvorením 10:00
                  value:
                    type: urn:intelliwell:problem:outside-opening-hours
                    title: termín mimo otváracích hodín
                    status: 422
                    instance: /api/v1/reservations
                SC-001-10:
                  summary: Začiatok 25. 11. 2026 11:00 je pred aktuálnym časom 12:00
                  value:
                    type: urn:intelliwell:problem:start-not-in-future
                    title: začiatok termínu nie je v budúcnosti
                    status: 422
                    instance: /api/v1/reservations
                SC-001-11:
                  summary: Poznámka má 501 znakov
                  value:
                    type: urn:intelliwell:problem:note-too-long
                    title: poznámka je dlhšia ako 500 znakov
                    status: 422
                    instance: /api/v1/reservations
                SC-001-16:
                  summary: |
                    Porušené BR-007, BR-006, BR-005 aj BR-008 – vráti sa iba prvý dôvod podľa BR-012 (client-not-found)
                  value:
                    type: urn:intelliwell:problem:client-not-found
                    title: klient neexistuje v evidencii klientov
                    status: 422
                    instance: /api/v1/reservations
        "503":
          description: |
            Úložisko rezervácií nie je dostupné (QR-002; BR-012 pozícia 4 – po 400, pred prvým 422). Rezervácia
            sa neuloží, žiadny termín sa nezablokuje a systém uloženie automaticky neopakuje. Po obnovení
            dostupnosti je termín voľný. Scenár SC-001-15. Typ `service-unavailable`.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                SC-001-15:
                  summary: Evidencia rezervácií je pri ukladaní dočasne nedostupná
                  value:
                    type: urn:intelliwell:problem:service-unavailable
                    title: služba je dočasne nedostupná
                    status: 503
                    instance: /api/v1/reservations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer token (ADR-004, DR-07). Pre prototyp ho vydáva `dotnet user-jwts` (DR-23);
        prihlasovací endpoint nie je súčasťou contractu.
        Rola je v claime `role`; hodnota pre ROLE-SpravcaNavstev je `SpravcaNavstev` (ADR-007, DR-C01).
        Identita autora rezervácie pre `createdBy` (QR-001) je claim `sub` (ADR-007, DR-C02).
        Token bez neprázdneho claimu `sub` sa posudzuje ako neprihlásená osoba → 401 `unauthenticated`
        (ADR-007 doplnenie, DR-C12; BR-011).

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Korelačné ID požiadavky (DR-31). Platná hodnota je reťazec dĺžky 1–128 zo znakov 0x21–0x7E
        (tlačiteľné ASCII bez medzery); prázdna hodnota je neplatná (DR-C09).
        Ak hlavička chýba alebo má neplatnú hodnotu, systém vygeneruje UUID a vráti ho v odpovedi;
        požiadavku pre neplatné ID neodmietne (DR-C05). Schéma preto úmyselne neobmedzuje tvar –
        neplatná hodnota nie je dôvodom na 400.
      schema:
        type: string
      x-sdd-valid-format: '^[\x21-\x7E]{1,128}$'

  headers:
    CorrelationId:
      description: |
        Korelačné ID – platná hodnota prevzatá z požiadavky, inak UUID vygenerované systémom
        (DR-31, DR-C05, DR-C09). Vracia sa v každej odpovedi.
      required: true
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,128}$'
        examples: [7d0f5b3a-1e2c-4a6b-9f8e-0c1d2e3f4a5b]

  schemas:
    UtcDateTime:
      type: string
      format: date-time
      pattern: "Z$"
      description: Čas RFC 3339 v UTC s príponou `Z` (DR-08, DR-C03).

    CreateReservationRequest:
      type: object
      description: |
        Vstup vytvorenia rezervácie. Dĺžku termínu recepčná nezadáva; koniec termínu určí systém
        ako začiatok + 60 minút (BR-004). Klient sa zadáva identifikátorom, nie vyhľadaním (DR-24).
      required: [clientId, startTime]
      properties:
        clientId:
          type: string
          format: uuid
          description: |
            Systémový identifikátor existujúceho klienta v evidencii klientov (DO-EvidenciaKlientov;
            DR-30, BR-007). Nie je odvodený z osobných údajov. Platné UUID, ktoré v evidencii nie je,
            vráti 422 `client-not-found`.
        startTime:
          allOf:
            - $ref: "#/components/schemas/UtcDateTime"
          description: |
            Začiatok termínu (Termín, glossary), RFC 3339 v UTC s príponou `Z` (DR-08, DR-C03); iný zápis → 400.
            Systém ho na overenie BR-005 prepočíta do Europe/Bratislava (DR-18).
        note:
          type: string
          description: |
            Poznámka (glossary) – voliteľná, najviac 500 znakov; znak = Unicode code point (BR-008, DR-C08).
            Limit nie je v schéme ako `maxLength`, lebo jeho porušenie je business pravidlo s odpoveďou
            422 `note-too-long` na pozícii 8 poradia BR-012, nie chyba tvaru (400). Poznámka je osobný údaj (DR-27).
          x-sdd-business-max-length: 500
          x-sdd-length-unit: unicode-code-point
          x-sdd-personal-data: true
          x-sdd-excluded-from-application-log: true # CON-003

    Reservation:
      type: object
      description: Uložená rezervácia (DO-Rezervacie, vlastník AC-ModulRezervaciiAKlientov – ADR-006).
      required: [id, clientId, startTime, endTime, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Systémový identifikátor rezervácie (UUID).
        clientId:
          type: string
          format: uuid
          description: Identifikátor klienta z evidencie klientov (DR-30).
        startTime:
          allOf:
            - $ref: "#/components/schemas/UtcDateTime"
          description: Začiatok termínu, RFC 3339 UTC.
        endTime:
          allOf:
            - $ref: "#/components/schemas/UtcDateTime"
          description: Koniec termínu = startTime + 60 minút (BR-004); interval [startTime, endTime) (DR-19).
        note:
          type: string
          maxLength: 500 # JSON Schema maxLength počíta Unicode code points (DR-C08); uložená poznámka spĺňa BR-008
          description: Poznámka, ak bola zadaná (BR-008). Pri rezervácii bez poznámky pole chýba. Osobný údaj (DR-27).
          x-sdd-personal-data: true
          x-sdd-excluded-from-application-log: true # CON-003
        status:
          type: string
          enum: [created]
          description: |
            Stav rezervácie podľa lifecycles.yaml – iba „vytvorená“ (DR-04), v API hodnota `created`
            (`api_value`, DR-C11).
        createdBy:
          type: string
          minLength: 1
          description: |
            Prihlásená osoba personálu, ktorá rezerváciu vytvorila (QR-001, DR-13); hodnota claimu
            `sub` z bearer tokenu (ADR-007, DR-C02).
        createdAt:
          allOf:
            - $ref: "#/components/schemas/UtcDateTime"
          description: Čas vytvorenia rezervácie, RFC 3339 UTC (QR-001).

    ProblemDetails:
      type: object
      description: |
        Problem details podľa RFC 9457 (DR-08). `type` identifikuje dôvod odmietnutia (BR-010, BR-012, QR-002)
        ako URN `urn:intelliwell:problem:<kód>` (DR-C07); `title` je pomenovanie dôvodu podľa BR-012 `reason`.
        `detail` nesmie obsahovať text poznámky (CON-003).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:intelliwell:problem:unauthenticated
            - urn:intelliwell:problem:forbidden
            - urn:intelliwell:problem:invalid-request
            - urn:intelliwell:problem:service-unavailable
            - urn:intelliwell:problem:client-not-found
            - urn:intelliwell:problem:start-not-in-future
            - urn:intelliwell:problem:outside-opening-hours
            - urn:intelliwell:problem:note-too-long
            - urn:intelliwell:problem:slot-occupied
        title:
          type: string
        status:
          type: integer
          enum: [400, 401, 403, 409, 422, 503]
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
