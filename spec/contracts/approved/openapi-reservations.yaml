      responses:
        "201":
          description: |
            Rezervácia je uložená v stave `created` („vytvorená“) a jej termín je zablokovaný pre ďalších klientov
            (BR-001, BR-002, BR-004, QR-001). Scenáre SC-001-01, SC-001-02, SC-001-03, SC-001-14
            a prvá uložená požiadavka v SC-001-06.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              examples:
