# PROPOSED contract – návrh AI v režime DESIGN_CONTRACT (úloha 0003, log spec/prompts/log/0003-2026-11-25-DESIGN_CONTRACT.md).
# Nie je schválený. Schválenie zaznamenáva iba človek (AGENTS.md kap. 9).
# Specification baseline 0.2.0 / architecture baseline B-01; profil spec/policies/contract-design-profile.yaml.
# Mapping na Requirement, Application Service, Component, scenáre, rules a Data Objects: contract-mapping.yaml.
# Otvorené rozhodnutia DR-C01 až DR-C08: reports/contract-review-0.1.0.md. Miesta, ktoré od nich závisia, majú
# v popise značku „(návrh – DR-Cxx)“.

openapi: 3.1.0

info:
  title: IntelliWell – Rezervácie (FR1 Vytvorenie rezervácie)
  version: 0.1.0
  summary: HTTP API Služby správy rezervácií a klientov pre vytvorenie rezervácie.
  description: |
    Rozhranie Application Service AS-SpravaRezervaciiAKlientov, ktorú poskytuje
    Application Component AC-ModulRezervaciiAKlientov (B-01). Rozsah: iba FR1 (UC01).

    Mimo rozsahu tohto contractu (FR1 scope): vyhľadanie klienta (DR-24), registrácia klienta (FR2),
    priradenie saunového majstra (DR-10), zrušenie a zmena rezervácie (DR-04), sumarizácia a UI (DR-17),
    INT-001 (DR-25), prihlasovací endpoint a vydávanie tokenov (DR-23).

    Konvencie (contract-design-profile.yaml):
    - čas: RFC 3339 v UTC (DR-08); otváracie hodiny sa overujú v Europe/Bratislava (DR-18),
    - chyby: problem details, RFC 9457 (DR-08), médium `application/problem+json`,
    - korelácia: hlavička `X-Correlation-ID` (DR-31),
    - identifikátory: UUID (klient podľa DR-30),
    - verzia: major verzia v URL `/api/v1` (DR-31),
    - idempotencia: žiadna; vytvorenie rezervácie nie je idempotentné (DR-28).
  x-sdd:
    contract_id: API-Reservations
    contract_version: 0.1.0
    status: proposed
    specification_version: 0.2.0
    architecture_baseline: B-01
    application_service: AS-SpravaRezervaciiAKlientov
    provided_by_component: AC-ModulRezervaciiAKlientov
    requirements: [FR1, NFR1, NFR4, QR-001]
    constraints: [CON-003]
    decisions: [ADR-001, ADR-004, ADR-005, ADR-006]
    mapping: spec/contracts/proposed/contract-mapping.yaml
    approved_by: null

servers:
  - url: /
    description: Relatívny koreň; prostredie prototypu nie je rozhodnuté (deployment.yaml).

tags:
  - name: Rezervácie
    description: Rezervácia termínu v miestnosti NikaWell (BS-RezervaciaTerminu, BP-SpravaNavstev).

security:
  - bearerAuth: [SpravcaNavstev]

paths:
  /api/v1/reservations:
    post:
      operationId: createReservation
      tags: [Rezervácie]
      summary: Vytvoriť rezerváciu pre existujúceho klienta
      description: |
        Správca návštev (ROLE-SpravcaNavstev) vytvorí rezerváciu pre klienta z evidencie klientov
        na termín so zadaným začiatkom a pevnou dĺžkou 60 minút (FR1, BP-SpravaNavstev-01, -02, -04).

        Systém pred uložením overí dostupnosť termínu (BR-001):
        - termín sa neprekrýva so žiadnou uloženou rezerváciou (BR-003); termín je polootvorený
          interval [začiatok, koniec), rezervácia môže začať presne v čase konca inej (DR-19),
        - termín leží celý v otváracích hodinách 10:00–22:00 Europe/Bratislava (BR-005, DR-18),
        - začiatok termínu je v budúcnosti v čase uloženia (BR-006),
        - klient existuje v evidencii klientov (BR-007),
        - poznámka, ak je zadaná, má najviac 500 znakov (BR-008).

        Po uložení je rezervácia v stave `vytvorena` a jej termín je zablokovaný pre ďalších klientov
        (BR-002, OUT-001). Systém zaznamená, kto a kedy rezerváciu vytvoril (QR-001); osoba sa určí
        z bearer tokenu (ADR-004).

        Ak systém rezerváciu neuloží, vráti problem details s pomenovaným dôvodom a iný termín
        neponúka (BR-010). Pri každom odmietnutí platí: rezervácia nevznikne a žiadny termín sa
        nezablokuje (lifecycles.yaml, rejected_creation).

        Súbeh (BR-009, ADR-001): ak dve požiadavky s prekrývajúcim sa termínom prídu súčasne,
        uloží sa iba prvá uložená (201); druhá dostane 409 `slot-occupied`.

        Opakované odoslanie (DR-28): operácia nie je idempotentná. Opakovanie tej istej požiadavky po
        úspešnom uložení vráti 409 `slot-occupied`.

        Poradie vyhodnotenia, ak požiadavka porušuje viac pravidiel (návrh – DR-C04): 401 → 403 → 400 →
        422 (`note-too-long`, `client-not-found`, `start-not-in-future`, `outside-opening-hours`) → 409.
        Systém vráti jeden problem details pre prvé porušené pravidlo.

        Audit (QR-001, DR-26): zaznamenáva sa iba úspešné vytvorenie; záznam obsahuje identifikátor
        rezervácie, kto ju vytvoril a kedy.
      x-sdd:
        requirements: [FR1, NFR1, NFR4, QR-001]
        business_rules: [BR-001, BR-002, BR-003, BR-004, BR-005, BR-006, BR-007, BR-008, BR-009, BR-010, BR-011]
        scenarios: [SC-001-01, SC-001-02, SC-001-03, SC-001-04, SC-001-05, SC-001-06, SC-001-07,
                    SC-001-08, SC-001-09, SC-001-10, SC-001-11, SC-001-12, SC-001-13, SC-001-14]
        data_objects: [DO-Rezervacie, DO-EvidenciaKlientov]
        lifecycle_transition: "DO-Rezervacie: (none) → vytvorena"
        idempotent: false
      security:
        - bearerAuth: [SpravcaNavstev]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
            examples:
              SC-001-01:
                summary: Voľný termín 1. 12. 2026 14:00–15:00 (Europe/Bratislava), s poznámkou
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T13:00:00Z', note: prvá návšteva }
              SC-001-02:
                summary: Bez poznámky, 2. 12. 2026 11:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-02T10:00:00Z' }
              SC-001-03:
                summary: Termín končiaci presne pri zatvorení, 3. 12. 2026 21:00–22:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-03T20:00:00Z' }
              SC-001-04:
                summary: Obsadený termín 1. 12. 2026 14:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T13:00:00Z' }
              SC-001-05:
                summary: Čiastočné prekrytie, začiatok 1. 12. 2026 14:30
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T13:30:00Z' }
              SC-001-06:
                summary: Súbeh – obe požiadavky so začiatkom 4. 12. 2026 16:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-04T15:00:00Z' }
              SC-001-07:
                summary: Klient, ktorý nie je v evidencii klientov, 1. 12. 2026 16:00
                value: { clientId: 0b6f2a5e-3c1d-4f8a-9e2b-5d4c3b2a1f00, startTime: '2026-12-01T15:00:00Z' }
              SC-001-08:
                summary: Presah zatváracej hodiny, začiatok 1. 12. 2026 21:30
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T20:30:00Z' }
              SC-001-09:
                summary: Začiatok pred otvorením, 1. 12. 2026 09:30
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T08:30:00Z' }
              SC-001-10:
                summary: Začiatok v minulosti, 25. 11. 2026 11:00 (aktuálny čas 12:00)
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-11-25T10:00:00Z' }
              SC-001-11:
                summary: Poznámka dlhá 501 znakov (obsah vynechaný)
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T17:00:00Z', note: '<501 znakov>' }
              SC-001-12:
                summary: Osoba bez roly SpravcaNavstev, 1. 12. 2026 19:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T18:00:00Z' }
              SC-001-13:
                summary: Neprihlásená osoba, 1. 12. 2026 20:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T19:00:00Z' }
              SC-001-14:
                summary: Nadväzujúci termín 1. 12. 2026 15:00–16:00
                value: { clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, startTime: '2026-12-01T14:00:00Z' }
      responses:
        '201':
          description: |
            Rezervácia je uložená v stave `vytvorena` a jej termín je zablokovaný pre ďalších klientov
            (BR-001, BR-002, BR-004, QR-001). Scenáre SC-001-01, SC-001-02, SC-001-03, SC-001-14
            a prvá požiadavka v SC-001-06.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              examples:
                SC-001-01:
                  value:
                    id: 2f1d4c6e-8a3b-4e5f-9c7d-1a2b3c4d5e6f
                    clientId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    startTime: '2026-12-01T13:00:00Z'
                    endTime: '2026-12-01T14:00:00Z'
                    note: prvá návšteva
                    status: vytvorena
                    createdBy: jana
                    createdAt: '2026-11-25T11:00:00Z'
        '400':
          description: |
            Požiadavka nemá platný tvar: telo nie je JSON, chýba `clientId` alebo `startTime`,
            `clientId` nie je UUID alebo `startTime` nie je RFC 3339 čas v UTC (návrh – DR-C03).
            Rezervácia nevznikne. Typ `invalid-request`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalid-request:
                  value:
                    type: urn:intelliwell:problem:invalid-request
                    title: neplatná požiadavka
                    status: 400
                    detail: Pole startTime musí byť čas vo formáte RFC 3339 v UTC.
                    instance: /api/v1/reservations
        '401':
          description: |
            Osoba nie je prihlásená: chýba bearer token alebo je neplatný (BR-011, NFR4, ADR-004).
            Rezervácia nevznikne a termín zostane voľný. Scenár SC-001-13. Typ `unauthenticated`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            WWW-Authenticate:
              description: Výzva na autentifikáciu, schéma `Bearer` (RFC 6750).
              schema:
                type: string
                examples: [Bearer]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                SC-001-13:
                  value:
                    type: urn:intelliwell:problem:unauthenticated
                    title: osoba nie je prihlásená
                    status: 401
                    instance: /api/v1/reservations
        '403':
          description: |
            Prihlásená osoba nemá v claime `role` hodnotu `SpravcaNavstev` (návrh – DR-C01), ktorá
            zodpovedá ROLE-SpravcaNavstev (BR-011, ADR-004). Rezervácia nevznikne a termín zostane voľný.
            Scenár SC-001-12. Typ `forbidden`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                SC-001-12:
                  value:
                    type: urn:intelliwell:problem:forbidden
                    title: nedostatočné oprávnenie
                    status: 403
                    instance: /api/v1/reservations
        '409':
          description: |
            Termín obsadený: termín sa prekrýva s uloženou rezerváciou (BR-003), vrátane súbehu (BR-009,
            ADR-001) a opakovaného odoslania (DR-28). Rezervácia nevznikne, pôvodná rezervácia sa nemení,
            iný termín sa neponúka (BR-010). Scenáre SC-001-04, SC-001-05, druhá požiadavka v SC-001-06.
            Typ `slot-occupied`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                SC-001-04:
                  value:
                    type: urn:intelliwell:problem:slot-occupied
                    title: termín obsadený
                    status: 409
                    instance: /api/v1/reservations
        '422':
          description: |
            Vstup má platný tvar, ale nespĺňa business pravidlo (NFR1, BR-010). Rezervácia nevznikne.
            Typ určuje pomenovaný dôvod:
            - `outside-opening-hours` – „termín mimo otváracích hodín“ (BR-005; SC-001-08, SC-001-09),
            - `start-not-in-future` – „začiatok termínu nie je v budúcnosti“ (BR-006; SC-001-10),
            - `client-not-found` – „klient neexistuje v evidencii klientov“ (BR-007; SC-001-07),
            - `note-too-long` – „poznámka je dlhšia ako 500 znakov“ (BR-008; SC-001-11).
            Odpoveď nikdy neobsahuje text poznámky.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                SC-001-07:
                  value:
                    type: urn:intelliwell:problem:client-not-found
                    title: klient neexistuje v evidencii klientov
                    status: 422
                    instance: /api/v1/reservations
                SC-001-08:
                  value:
                    type: urn:intelliwell:problem:outside-opening-hours
                    title: termín mimo otváracích hodín
                    status: 422
                    instance: /api/v1/reservations
                SC-001-10:
                  value:
                    type: urn:intelliwell:problem:start-not-in-future
                    title: začiatok termínu nie je v budúcnosti
                    status: 422
                    instance: /api/v1/reservations
                SC-001-11:
                  value:
                    type: urn:intelliwell:problem:note-too-long
                    title: poznámka je dlhšia ako 500 znakov
                    status: 422
                    instance: /api/v1/reservations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer token (ADR-004, DR-07). Pre prototyp ho vydáva `dotnet user-jwts` (DR-23);
        prihlasovací endpoint nie je súčasťou contractu. Rola je v claime `role`.
        Hodnota pre ROLE-SpravcaNavstev: `SpravcaNavstev` (návrh – DR-C01).
        Identita osoby pre `createdBy` (QR-001) je claim `sub` (návrh – DR-C02).

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Korelačné ID požiadavky (DR-31). Ak chýba, systém ID vygeneruje. ID sa vždy vráti
        v hlavičke odpovede. Tvar prijímanej hodnoty a správanie pri neplatnej hodnote nie sú
        rozhodnuté (DR-C05); vygenerované ID je UUID (návrh – DR-C05).
      schema:
        type: string

  headers:
    CorrelationId:
      description: Korelačné ID – prevzaté z požiadavky alebo vygenerované systémom (DR-31).
      required: true
      schema:
        type: string

  schemas:
    CreateReservationRequest:
      type: object
      description: |
        Vstup vytvorenia rezervácie. Dĺžku termínu recepčná nezadáva; koniec termínu určí systém
        ako začiatok + 60 minút (BR-004). Klient sa zadáva identifikátorom, nie vyhľadaním (DR-24).
      required: [clientId, startTime]
      properties:
        clientId:
          type: string
          format: uuid
          description: |
            Systémový identifikátor existujúceho klienta v evidencii klientov (DO-EvidenciaKlientov;
            DR-30, BR-007). Nie je odvodený z osobných údajov.
        startTime:
          type: string
          format: date-time
          description: |
            Začiatok termínu (Termín, glossary), RFC 3339 v UTC so suffixom `Z` (DR-08; tvar návrh – DR-C03).
            Systém ho na overenie BR-005 prepočíta do Europe/Bratislava (DR-18).
        note:
          type: string
          maxLength: 500
          description: |
            Poznámka (glossary) – voliteľná, najviac 500 znakov (BR-008; počítanie znakov návrh – DR-C08).
            Prekročenie dĺžky vráti 422 `note-too-long`, nie 400. Poznámka je osobný údaj (DR-27).
          x-sdd-personal-data: true
          x-sdd-excluded-from-application-log: true # CON-003

    Reservation:
      type: object
      description: Uložená rezervácia (DO-Rezervacie, vlastník AC-ModulRezervaciiAKlientov – ADR-006).
      required: [id, clientId, startTime, endTime, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Systémový identifikátor rezervácie (UUID).
        clientId:
          type: string
          format: uuid
          description: Identifikátor klienta z evidencie klientov (DR-30).
        startTime:
          type: string
          format: date-time
          description: Začiatok termínu, RFC 3339 UTC.
        endTime:
          type: string
          format: date-time
          description: Koniec termínu = startTime + 60 minút (BR-004); interval [startTime, endTime) (DR-19).
        note:
          type: string
          maxLength: 500
          description: Poznámka, ak bola zadaná (BR-008). Osobný údaj (DR-27).
          x-sdd-personal-data: true
          x-sdd-excluded-from-application-log: true # CON-003
        status:
          type: string
          enum: [vytvorena]
          description: Stav rezervácie podľa lifecycles.yaml – iba „vytvorená“ (DR-04).
        createdBy:
          type: string
          description: |
            Prihlásená osoba personálu, ktorá rezerváciu vytvorila (QR-001, DR-13); hodnota claimu
            `sub` z bearer tokenu (návrh – DR-C02).
        createdAt:
          type: string
          format: date-time
          description: Čas vytvorenia rezervácie, RFC 3339 UTC (QR-001).

    ProblemDetails:
      type: object
      description: |
        Problem details podľa RFC 9457 (DR-08). `type` identifikuje dôvod odmietnutia (BR-010),
        `title` je jeho pomenovanie. Znenie titulov okrem „termín obsadený“ (DR-02) je návrh AI
        z BR-010.reasons_proposed. `detail` nesmie obsahovať text poznámky.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:intelliwell:problem:invalid-request
            - urn:intelliwell:problem:unauthenticated
            - urn:intelliwell:problem:forbidden
            - urn:intelliwell:problem:slot-occupied
            - urn:intelliwell:problem:outside-opening-hours
            - urn:intelliwell:problem:start-not-in-future
            - urn:intelliwell:problem:client-not-found
            - urn:intelliwell:problem:note-too-long
        title:
          type: string
        status:
          type: integer
          enum: [400, 401, 403, 409, 422]
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
