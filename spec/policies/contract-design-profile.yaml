# Contract design profile (draft).
# Hodnoty podľa ľudských rozhodnutí DR-07, DR-08, DR-18, DR-23, DR-27, DR-28, DR-30, DR-31 (log 0002, ADR-004, ADR-005 – Proposed).
# Položky s null neboli rozhodnuté. AI ich nesmie doplniť z ukážky šablóny.

contract_design_profile:
  status: "approved"
  approved_by: Martin Štefanko (Software architect)"
  reviewed_by: null
  specification_version: "0.2.0"
  interface_style: "HTTP API" # DR-08, ADR-005
  http:
    specification: "OpenAPI 3.1" # DR-08
    naming:
      paths: "kebab-case, podstatné mená v množnom čísle, prefix /api/v1 (napr. /api/v1/reservations)" # DR-31
      operation_ids: "lowerCamelCase" # DR-31
    date_time: "RFC 3339 UTC" # DR-08; API prijíma a vracia UTC
    business_time_zone: "Europe/Bratislava" # DR-18; systém prepočíta UTC pri overení otváracích hodín
    errors: "problem-details (RFC 9457)" # DR-08
    correlation_id_header: "X-Correlation-ID" # DR-31
    correlation_id_behavior: "ak hlavička v požiadavke chýba, systém ID vygeneruje; ID sa vždy vráti v odpovedi" # DR-31
    idempotency: "none – vytvorenie rezervácie nie je idempotentné; opakovanie odmietne BR-003 („termín obsadený“)" # DR-28
  events:
    specification: null # FR1 eventy nepoužíva (DR-08)
    naming: null
  security:
    authentication: "JWT bearer token" # DR-07, ADR-004
    authorization: "podľa roly; vytvorenie rezervácie iba ROLE-SpravcaNavstev" # DR-07, BR-011
    token_issuance: "prototyp: dotnet user-jwts; prihlasovací endpoint mimo slice" # DR-23
    role_claim: "role" # DR-23; hodnota pre ROLE-SpravcaNavstev sa navrhne v contracte
  logging:
    personal_data: "obsah poznámky rezervácie sa nezapisuje do aplikačného logu (CON-003)" # DR-27
  identifiers:
    client: "systémový identifikátor UUID; nie je odvodený z osobných údajov" # DR-30
  compatibility:
    versioning: "major verzia v URL (/api/v1); prototyp má iba v1" # DR-31
    breaking_change: "vyžaduje ľudské rozhodnutie a novú major verziu" # DR-31
