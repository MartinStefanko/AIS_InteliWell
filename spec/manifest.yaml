# Manifest SDD balíka IntelliWell – FR1 Vytvorenie rezervácie.
# Podľa SDD_PROJECT_TEMPLATE_v4, kap. 4.3. Cesty sa počítajú od koreňa repozitára.
# Manifest je zoznam podkladov, nie schválenie. Stav každého súboru je uvedený v súbore samotnom.
# Zmeny pre 0.2.0 navrhla AI v úlohe 0002; sú necommitnuté a čakajú na kontrolu človekom.

specification:
  version: "0.2.0" # návrh AI v 0002 (PREPARE_SPEC); predchádzajúci baseline 0.1.0
  status: "approved" # návrh AI v 0002 (PREPARE_SPEC); predchádzajúci baseline draft
  architecture_baseline: "B-01"
  ai_rules_version: "4.0"
  selected_functionality:
    requirement: "FR1"
    use_case: "UC01"

governance:
  ai_rules: "AGENTS.md"

authoritative:
  architecture_model: null # model zostáva v Sparx EA u tímu
  glossary: "spec/glossary.md"
  requirements: "spec/requirements/requirements.yaml"
  business_rules: "spec/requirements/business-rules.yaml"
  quality_requirements: "spec/requirements/quality-requirements.yaml"
  actors_processes: "spec/business/actors-processes.yaml"
  business_scenarios: null # spec/business/scenarios/ existuje, zatiaľ prázdny
  components: "spec/application/components.yaml"
  service_realization: "spec/application/service-realization.yaml"
  interactions: "spec/application/interactions.yaml"
  data_objects: "spec/application/data-objects.yaml"
  lifecycles: "spec/application/lifecycles.yaml"
  technology_context: "spec/technology/technology-context.yaml"
  deployment: "spec/technology/deployment.yaml" # vznikol v 0002 (DR-09)
  contract_design_profile: "spec/policies/contract-design-profile.yaml" # draft, čiastočne vyplnený (DR-07, DR-08)
  stories: "spec/stories/" # US-001 (draft, 0002); umiestnenie pozri DR-29
  scenarios: "spec/stories/features/" # US-001.feature (draft, 0002)
  decisions: "spec/architecture/decisions/" # ADR-001 – ADR-006 v stave Proposed (0002) + šablóna ADR-000
  approved_contracts: null # spec/contracts/approved/ existuje, zatiaľ prázdny
  traceability: "spec/traceability/traceability.yaml"
  reuse_catalog: "spec/architecture/continuum/reuse-catalog.yaml"
  implementation_context: "spec/architecture/migration/implementation-context.yaml"
  gap_analysis: "spec/architecture/migration/gap-analysis.md"

