  architecture_context: null # voliteľný ručný súhrn, nie export
  # Rozšírenie vzoru šablóny (na potvrdenie človekom): zdrojové dokumenty, z ktorých vznikli drafty.
  source_documents:
    - path: "docs/sources/AIS_IntelliWell.docx"
      role: "architektonický projekt – jediný obsahový zdroj o IntelliWell"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
      confirmed_as_source_for: "B-01 (DR-16, človek v 0001 – Ľudské rozhodnutie)"
    - path: "docs/sources/SDD_PROJECT_TEMPLATE_v4.pdf"
      role: "šablóna štruktúry a formátov"
    - path: "docs/sources/SDD_AI_RULES_v4.pdf"
      role: "pravidlá práce AI (prepis v AGENTS.md)"
    - path: "docs/sources/SDD_FIIT_STU_architect_v4.pdf"
      role: "metodika SDD"

working:
  proposed_contracts: "spec/contracts/proposed/"
  specification_drafts: "spec/drafts/"
  prompts: "spec/prompts/"
  reports: "reports/"

realization:
  code: "src/" # src/IntelliWell (0007); UI v src/IntelliWell/wwwroot (po ADR-010)
  configuration: "config/"
  tests: "tests/" # tests/IntelliWell.Tests (0007)
