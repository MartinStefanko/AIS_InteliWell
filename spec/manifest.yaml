  architecture_views:
    - path: "spec/architecture/views/B-01-requirements-realization-tobe.png"
      viewpoint: "Requirements Realization"
      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
      extracted_from: "docs/sources/AIS_IntelliWell.docx#word/media/image6.png"
      note: "Titulok diagramu nemá označenie TO-BE."
