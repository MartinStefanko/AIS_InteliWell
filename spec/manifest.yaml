      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
      extracted_from: "docs/sources/AIS_IntelliWell.docx#word/media/image20.png"
    - path: "spec/architecture/views/B-01-motivation-tobe.png"
      viewpoint: "Motivation"
      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
      extracted_from: "docs/sources/AIS_IntelliWell.docx#word/media/image3.png"
      note: "Titulok diagramu nemá označenie TO-BE; view nemá AS-IS variant."
    - path: "spec/architecture/views/B-01-implementation-migration-tobe.png"
      viewpoint: "Implementation and Migration"
      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
