      extracted_from: "docs/sources/AIS_IntelliWell.docx#word/media/image10.png"
    - path: "spec/architecture/views/B-01-application-cooperation-tobe.png"
      viewpoint: "Application Cooperation"
      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
      extracted_from: "docs/sources/AIS_IntelliWell.docx#word/media/image12.png"
    - path: "spec/architecture/views/B-01-application-usage-tobe.png"
      viewpoint: "Application Usage"
      model_baseline: "B-01"
      status: "approved"
      reviewed_by: "Martin Štefanko (Software architect)"
