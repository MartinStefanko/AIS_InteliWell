      Systém preto musí umožniť recepčnej zaevidovať rezerváciu aj profil klienta
      bez ohľadu na kanál (docx kap. 6, 8.1).
    influences: ["FR1"] # aj FR2 (mimo rozsahu)
    source_view: "spec/architecture/views/B-01-requirements-realization-tobe.png"
    owner: null
    status: "draft"

