constraints:
  - id: "CON-001"
    statement: "Požiadavky prichádzajú telefonicky, e-mailom, SMS alebo osobne."
    consequence_in_source: >
      Systém preto musí umožniť recepčnej zaevidovať rezerváciu aj profil klienta
      bez ohľadu na kanál (docx kap. 6, 8.1).
    influences: ["FR1"] # aj FR2 (mimo rozsahu)
    source_view: "spec/architecture/views/B-01-requirements-realization-tobe.png"
    owner: null
    status: "draft"

  - id: "CON-002"
    statement: "Interný systém len pre personál."
    consequence_in_source: "Klient so systémom priamo nepracuje (docx kap. 6)."
    influences: ["NFR4"]
    source_view: "spec/architecture/views/B-01-requirements-realization-tobe.png"
    owner: null
    status: "draft"

  - id: "CON-003"
    statement: "Obsah poznámky rezervácie sa nesmie zapisovať do aplikačného logu."
    reason: "Poznámka je osobný údaj (DR-27)."
    origin: "DR-27 (ľudské rozhodnutie, nie je v docx)"
    influences: ["FR1", "QR-001"]
    applies_to_data_objects: ["DO-Rezervacie"]
    owner: null # DR-21 určuje ownera FR1, BR-*, NFR1, NFR4 a QR-001; owner constraintov nebol určený
    status: "draft"
