# Business rules pre FR1 (draft).
# BR-001, BR-002: z docx (docs/sources/AIS_IntelliWell.docx).
# BR-003 až BR-011: zápis ľudských rozhodnutí DR-01, 02, 03, 07, 11, 14, 17 (log 0002). Znenie formuloval AI;
# význam potvrdzuje owner ACT-Manazer (DR-21). Doplnené DR-18 až DR-22 a DR-28 (doplňujúci prompt 0002).
# Časové údaje (10:00, 22:00) sú v časovom pásme Europe/Bratislava (DR-18).
# 0004 (návrh 0.3.0): BR-008 spresnené podľa DR-C08, nové BR-012 podľa DR-C04 a DR-C10 (contract review 0.1.0).
# Zmeny čakajú na kontrolu človekom; stav súboru ani položiek AI nemenila (F-03).

meta:
  status: "approved"
  approved_by: "Martin Štefanko (Software architect)"
  reviewed_by: "Martin Štefanko (Software architect)"
  architecture_baseline: "B-01"
  specification_version: "0.3.0" # návrh 0004

business_rules:
  - id: "BR-001"
    title: "Rezervácia sa uloží po overení dostupnosti termínu"
    type: "rule"
    statement: >
      Systém pred uložením rezervácie overí dostupnosť termínu. Termín je dostupný, ak sa neprekrýva
      so žiadnou uloženou rezerváciou (BR-003), leží celý v otváracích hodinách (BR-005)
      a jeho začiatok je v budúcnosti (BR-006).
    source: >
      docx kap. 5, 8.3.2, BPC View TO-BE (Overenie dostupnosti a uloženie rezervácie);
      význam „dostupný“ podľa DR-01 a DR-14.
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    scenarios:
      [
        "SC-001-01",
        "SC-001-04",
        "SC-001-05",
        "SC-001-08",
        "SC-001-09",
        "SC-001-10",
      ]
    status: "approved"

  - id: "BR-002"
    title: "Po uložení rezervácie je termín zablokovaný pre ďalších klientov"
    type: "rule"
    statement: >
      Po uložení rezervácie systém zablokuje jej termín (začiatok + 60 minút) pre ďalších klientov.
      Termín zostáva zablokovaný, kým rezervácia existuje. Uvoľnenie termínu nie je v rozsahu,
      lebo zrušenie rezervácie je mimo rozsahu (DR-04).
    source: "docx kap. 4, 5, 7, 8.3.2, 13.1; DR-04."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    realizes_outcome: "OUT-001"
    scenarios: ["SC-001-01", "SC-001-04"]
    status: "approved"

  - id: "BR-003"
    title: "Uložené rezervácie sa časovo neprekrývajú"
    type: "invariant"
    statement: >
      NikaWell má jednu miestnosť. V každom okamihu existuje najviac jedna uložená rezervácia, ktorej
      termín tento okamih obsahuje. Žiadne dve uložené rezervácie sa časovo neprekrývajú.
    source: "DR-01 (jedna miestnosť NikaWell → max. 1 rezervácia v čase), DR-02."
    interval: "polootvorený [začiatok, koniec) – rezervácia môže začať presne v čase konca predchádzajúcej (DR-19)"
    enforcement_note: >
      Invariant platí v každom platnom stave vrátane súbežného spracovania (ADR-001). Vytvorenie nie je
      idempotentné: opakované odoslanie tej istej požiadavky invariant odmietne s dôvodom „termín obsadený“ (DR-28).
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    decisions: ["ADR-001"]
    scenarios: ["SC-001-04", "SC-001-05", "SC-001-06", "SC-001-14"]
    status: "approved"

  - id: "BR-004"
    title: "Termín má pevnú dĺžku 60 minút"
    type: "rule"
    statement: >
      Termín rezervácie je určený začiatkom (dátum a čas), ktorý zadá recepčná. Koniec termínu je
      začiatok + 60 minút. Dĺžku termínu recepčná nezadáva. Termín je polootvorený interval
      [začiatok, koniec) (DR-19).
    source: "DR-01, DR-19."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    scenarios: ["SC-001-01", "SC-001-14"]
    status: "approved"

  - id: "BR-005"
    title: "Termín leží celý v otváracích hodinách"
    type: "rule"
    statement: >
      Otváracie hodiny NikaWell sú 10:00–22:00 v časovom pásme Europe/Bratislava a platia každý deň
      rovnako. Začiatok aj koniec termínu musia ležať v otváracích hodinách. Termín, ktorý začína pred 10:00
      alebo končí po 22:00 miestneho času, systém odmietne. Čas prijatý v UTC systém na overenie prepočíta
      do Europe/Bratislava. Sviatky a výnimky sú mimo rozsahu.
    source: "DR-01, DR-14, DR-18, DR-20."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1", "NFR1"]
    scenarios: ["SC-001-03", "SC-001-08", "SC-001-09"]
    status: "approved"

  - id: "BR-006"
    title: "Začiatok termínu je v budúcnosti"
    type: "rule"
    statement: "Systém odmietne rezerváciu, ktorej začiatok nie je v budúcnosti v čase uloženia."
    source: "DR-14."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1", "NFR1"]
    scenarios: ["SC-001-10"]
    status: "approved"

  - id: "BR-007"
    title: "Rezervácia iba pre existujúceho klienta"
    type: "rule"
    statement: >
      Rezerváciu možno vytvoriť iba pre klienta, ktorý existuje v evidencii klientov
      (DO-EvidenciaKlientov). Registrácia klienta (FR2) nie je súčasťou FR1.
    source: "DR-03, DR-14; docx kap. 14 (modul kontroluje existenciu klienta)."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1", "NFR1"]
    scenarios: ["SC-001-07"]
    status: "approved"

  - id: "BR-008"
    title: "Poznámka je voliteľná a má najviac 500 znakov"
    type: "rule"
    statement: >
      Poznámka je voliteľná súčasť rezervácie. Ak ju recepčná zadá, má najviac 500 znakov.
      Znaky sa počítajú ako Unicode code points. Dlhšiu poznámku systém odmietne.
    length_unit: "Unicode code point" # DR-C08
    source: "DR-14, DR-17; hodnota 500 je konečná (DR-22); počítanie znakov DR-C08."
    related_constraints: ["CON-003"] # obsah poznámky sa nesmie zapisovať do aplikačného logu (DR-27)
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1", "NFR1"]
    scenarios: ["SC-001-01", "SC-001-02", "SC-001-11"]
    status: "approved"

  - id: "BR-009"
    title: "Pri súbehu vyhrá prvá uložená rezervácia"
    type: "rule"
    statement: >
      Ak dve rezervácie s prekrývajúcim sa termínom vznikajú súčasne, uloží sa iba tá, ktorá bola uložená
      ako prvá. Druhú systém odmietne s dôvodom „termín obsadený“.
    source: "DR-02."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    decisions: ["ADR-001"]
    scenarios: ["SC-001-06"]
    status: "approved"

  - id: "BR-010"
    title: "Nedostupný termín sa odmietne s pomenovaným dôvodom"
    type: "rule"
    statement: >
      Ak termín nie je dostupný alebo vstup nespĺňa pravidlá, systém rezerváciu neuloží a uvedie
      pomenovaný dôvod odmietnutia. Iný termín systém neponúka. Token bez neprázdneho claimu sub sa posudzuje ako neprihlásená osoba (401 unauthenticated, DR-C12).
    source: "DR-11."
    reasons_proposed: # znenie navrhla AI; iba „termín obsadený“ je doslovne z rozhodnutia (DR-02)
      - {
          rule: "BR-003 / BR-009",
          reason: "termín obsadený",
          wording: "z rozhodnutia DR-02",
        }
      - {
          rule: "BR-005",
          reason: "termín mimo otváracích hodín",
          wording: "návrh AI",
        }
      - {
          rule: "BR-006",
          reason: "začiatok termínu nie je v budúcnosti",
          wording: "návrh AI",
        }
      - {
          rule: "BR-007",
          reason: "klient neexistuje v evidencii klientov",
          wording: "návrh AI",
        }
      - {
          rule: "BR-008",
          reason: "poznámka je dlhšia ako 500 znakov",
          wording: "návrh AI",
        }
    reason_ordering: "BR-012" # DR-C04: pri viacerých porušeniach jeden dôvod v pevnom poradí
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1"]
    scenarios:
      [
        "SC-001-04",
        "SC-001-05",
        "SC-001-06",
        "SC-001-07",
        "SC-001-08",
        "SC-001-09",
        "SC-001-10",
        "SC-001-11",
      ]
    status: "approved"

  - id: "BR-011"
    title: "Rezerváciu smie vytvoriť iba správca návštev"
    type: "rule"
    statement: >
      Rezerváciu smie vytvoriť iba prihlásená osoba personálu v role ROLE-SpravcaNavstev.
      Neprihlásenú osobu ani osobu v inej role systém odmietne a rezerváciu neuloží.
    source: "DR-07; NFR4, CON-002."
    owner: "ACT-Manazer" # DR-21
    requirements: ["FR1", "NFR4"]
    decisions: ["ADR-004"]
    scenarios: ["SC-001-12", "SC-001-13"]
    status: "approved"

  - id: "BR-012"
    title: "Pri viacerých porušeniach systém uvedie jeden dôvod podľa pevného poradia"
    type: "rule"
    statement: >
      Ak požiadavka na vytvorenie rezervácie porušuje viac pravidiel naraz, systém rezerváciu neuloží
      a uvedie iba jeden dôvod odmietnutia: prvý porušený v pevnom poradí uvedenom v `order`.
    order: # DR-C04, DR-C10; HTTP status a kód podľa rozhodnutia, znenie dôvodov podľa BR-010 a QR-002
      - {
          position: 1,
          http: 401,
          code: "unauthenticated",
          reason: "osoba nie je prihlásená",
          rule: "BR-011",
        }
      - {
          position: 2,
          http: 403,
          code: "forbidden",
          reason: "nedostatočné oprávnenie",
          rule: "BR-011",
        }
      - {
          position: 3,
          http: 400,
          code: "invalid-request",
          reason: "neplatná požiadavka (tvar vstupu, vrátane času mimo UTC – DR-C03)",
          rule: "NFR1",
        }
      - {
          position: 4,
          http: 503,
          code: "service-unavailable",
          reason: "služba je dočasne nedostupná",
          rule: "QR-002",
        } # DR-C10
      - {
          position: 5,
          http: 422,
          code: "client-not-found",
          reason: "klient neexistuje v evidencii klientov",
          rule: "BR-007",
        }
      - {
          position: 6,
          http: 422,
          code: "start-not-in-future",
          reason: "začiatok termínu nie je v budúcnosti",
          rule: "BR-006",
        }
      - {
          position: 7,
          http: 422,
          code: "outside-opening-hours",
          reason: "termín mimo otváracích hodín",
          rule: "BR-005",
        }
      - {
          position: 8,
          http: 422,
          code: "note-too-long",
          reason: "poznámka je dlhšia ako 500 znakov",
          rule: "BR-008",
        }
      - {
          position: 9,
          http: 409,
          code: "slot-occupied",
          reason: "termín obsadený",
          rule: "BR-003 / BR-009",
        }
    source: "DR-C04, DR-C10 (ľudské rozhodnutia k contract review 0.1.0, 0004)."
    owner: "ACT-Manazer" # podľa DR-21 (owner BR-*) – potvrdí človek
    requirements: ["FR1", "NFR1"]
    related_rules: ["BR-010"]
    scenarios: ["SC-001-16"]
    status: "approved"
